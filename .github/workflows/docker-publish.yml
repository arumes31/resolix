name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prepare minified build context
        shell: bash
        run: |
          build_context="${RUNNER_TEMP}/tailscale-dnsrewrite-build"
          minified_root="${RUNNER_TEMP}/tailscale-dnsrewrite-js"
          js_root="${build_context}/webgui/static/js"

          mkdir -p "${build_context}" "${minified_root}"
          rsync -a --delete --exclude '.git' ./ "${build_context}/"

          mapfile -d '' js_files < <(find "${js_root}" -type f -name '*.js' -print0)
          if (( ${#js_files[@]} == 0 )); then
            echo "No JavaScript files found under ${js_root}" >&2
            exit 1
          fi

          npx --yes esbuild@0.28.1 "${js_files[@]}" \
            --minify \
            --outbase="${js_root}" \
            --outdir="${minified_root}"
          cp -a "${minified_root}/." "${js_root}/"

          echo "BUILD_CONTEXT=${build_context}" >> "${GITHUB_ENV}"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
