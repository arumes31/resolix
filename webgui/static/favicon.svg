<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield shape representing security/Tailscale -->
  <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- DNS network node center -->
  <circle cx="32" cy="28" r="6" fill="#38bdf8"/>
  <!-- DNS text -->
  <text x="32" y="31" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7" fill="#0f172a">DNS</text>
  <!-- Network connections radiating out -->
  <line x1="32" y1="22" x2="32" y2="14" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37.2" y1="25" x2="44" y2="20" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37.2" y1="31" x2="44" y2="36" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26.8" y1="25" x2="20" y2="20" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26.8" y1="31" x2="20" y2="36" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Outer network nodes -->
  <circle cx="32" cy="13" r="3" fill="#818cf8"/>
  <circle cx="45" cy="19" r="3" fill="#818cf8"/>
  <circle cx="45" cy="37" r="3" fill="#818cf8"/>
  <circle cx="19" cy="19" r="3" fill="#818cf8"/>
  <circle cx="19" cy="37" r="3" fill="#818cf8"/>
  <!-- Checkmark at bottom of shield -->
  <path d="M24 44l5 5 11-11" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
