name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'docker-publish-latest' || format('docker-publish-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Prepare minified build context
        shell: bash
        run: |
          build_context="${RUNNER_TEMP}/resolix-build"
          minified_root="${RUNNER_TEMP}/resolix-js"
          js_root="${build_context}/webgui/static/js"

          mkdir -p "${build_context}" "${minified_root}"
          rsync -a --delete --exclude '.git' ./ "${build_context}/"

          mapfile -d '' js_files < <(find "${js_root}" -type f -name '*.js' -print0)
          if (( ${#js_files[@]} == 0 )); then
            echo "No JavaScript files found under ${js_root}" >&2
            exit 1
          fi

          npx --yes esbuild@0.28.1 "${js_files[@]}" \
            --minify \
            --outbase="${js_root}" \
            --outdir="${minified_root}"
          cp -a "${minified_root}/." "${js_root}/"

          echo "BUILD_CONTEXT=${build_context}" >> "${GITHUB_ENV}"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: build
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < webgui/VERSION)"
          if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "webgui/VERSION must contain a stable semantic version (X.Y.Z)" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v${app_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match webgui/VERSION (${expected_tag})" >&2
              exit 1
            fi
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.build.outputs.version }},enable=${{ steps.build.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.build.outputs.is_release == 'true' }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            BUILD_INFO=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          provenance: mode=max
          sbom: true
