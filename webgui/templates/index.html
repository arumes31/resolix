<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailscale DNS Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            color: var(--text-primary);
            backdrop-filter: blur(12px);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1.25rem;
            border-radius: 1rem;
            backdrop-filter: blur(12px);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            font-size: 0.9375rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1;
        }

        .badge-type {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .badge-ip {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            font-family: monospace;
        }

        .domain {
            font-weight: 500;
            color: var(--text-primary);
        }

        .timestamp {
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .refresh-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .no-results {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Tooltips for buttons without text */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            background: #000;
            color: #fff;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            z-index: 10;
        }

        [data-tooltip]:hover::after {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .search-container {
                max-width: 100%;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Tailscale DNS Monitor</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Monitoring last 1000 queries</p>
            </div>
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search domain or client IP...">
            </div>
            <button class="refresh-btn" onclick="fetchEvents()" data-tooltip="Reload latest events">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                <span>Refresh</span>
            </button>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Events</div>
                <div id="totalEvents" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique Domains</div>
                <div id="uniqueDomains" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique Clients</div>
                <div id="uniqueClients" class="stat-value">0</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Type</th>
                        <th>Domain</th>
                        <th>Client IP</th>
                    </tr>
                </thead>
                <tbody id="eventTable">
                    <!-- Events will be populated here -->
                </tbody>
            </table>
            <div id="noResults" class="no-results" style="display: none;">
                No events found matching your search.
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];

        async function fetchEvents() {
            try {
                const response = await fetch('/api/events');
                allEvents = await response.json();
                renderEvents();
                updateStats();
            } catch (error) {
                console.error('Error fetching events:', error);
            }
        }

        function renderEvents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tableBody = document.getElementById('eventTable');
            const noResults = document.getElementById('noResults');
            
            const filteredEvents = allEvents.filter(event => 
                event.domain.toLowerCase().includes(searchTerm) || 
                event.client_ip.toLowerCase().includes(searchTerm) ||
                event.type.toLowerCase().includes(searchTerm)
            );

            tableBody.innerHTML = '';
            
            if (filteredEvents.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                filteredEvents.forEach(event => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="timestamp">${event.timestamp}</td>
                        <td><span class="badge badge-type">${event.type}</span></td>
                        <td class="domain">${event.domain}</td>
                        <td><span class="badge badge-ip">${event.client_ip}</span></td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        function updateStats() {
            document.getElementById('totalEvents').textContent = allEvents.length;
            
            const uniqueDomains = new Set(allEvents.map(e => e.domain)).size;
            document.getElementById('uniqueDomains').textContent = uniqueDomains;
            
            const uniqueClients = new Set(allEvents.map(e => e.client_ip)).size;
            document.getElementById('uniqueClients').textContent = uniqueClients;
        }

        document.getElementById('searchInput').addEventListener('input', renderEvents);

        // Initial fetch
        fetchEvents();

        // Auto refresh every 30 seconds
        setInterval(fetchEvents, 30000);
    </script>
</body>
</html>
