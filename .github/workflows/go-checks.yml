name: Go Checks

on:
  push:
    branches: [ "main", "v2_test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  core:
    name: Core Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'webgui/go.mod'
          cache-dependency-path: 'webgui/go.sum'

      - name: Validate formatting, modules, vet, build, tests, and coverage
        run: bash ./contrib/validate.sh core

  static-analysis:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [lint, security, licenses, workflows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'webgui/go.mod'
          cache-dependency-path: 'webgui/go.sum'

      - name: Run ${{ matrix.check }} validation
        run: bash ./contrib/validate.sh "${{ matrix.check }}"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run frontend tests
        run: bash ./contrib/validate.sh frontend

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [core, static-analysis, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run UDP, TCP, DoH, and DoT smoke tests
        run: bash ./contrib/docker-smoke.sh
