version: "2"

linters:
  enable:
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - revive
    - unparam
  settings:
    gocritic:
      enabled-checks:
        - dupImport
        - importShadow
        - truncateCmp
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        - G104
      severity: medium
      config:
        G101:
          omit_entropy: false
        G601:
          min_length: 16
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: var-naming
          severity: warning
        - name: exported
          severity: warning
        - name: unused-parameter
          severity: warning
        - name: unreachable-code
          severity: error
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

severity:
  default: warning
  rules:
    - linters:
        - gosec
        - govet
      severity: error

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
