services:
  resolix:
    image: ghcr.io/arumes31/resolix:${IMAGE_VERSION:-v2.3.0}
    container_name: resolix
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_AUTHKEY_FILE=${TS_AUTHKEY_FILE:-}
      - DOMAINS=.internal.net:100.1.2.3,app.example.com:100.4.5.6
      - UPSTREAM_DNS=8.8.8.8 8.8.4.4
      - HEALTHCHECK_DOMAIN=google.com
      - MODE=master
      - NODE_NAME=${NODE_NAME:-resolix-1}
      - WEB_LISTEN_ADDR=${WEB_LISTEN_ADDR:-0.0.0.0}
      - BASE_URL=${BASE_URL:-/}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - INGEST_SECRET=${INGEST_SECRET:?INGEST_SECRET is required}
      - WEB_USERNAME=${WEB_USERNAME:?WEB_USERNAME is required}
      - WEB_PASSWORD=${WEB_PASSWORD:?WEB_PASSWORD is required}
      - DNS_ALLOWED_CLIENTS=${DNS_ALLOWED_CLIENTS:-}
      - DNS_DISALLOWED_CLIENTS=${DNS_DISALLOWED_CLIENTS:-}
      - RATE_LIMIT_QPS=${RATE_LIMIT_QPS:-20}
      - PRIVATE_PTR=${PRIVATE_PTR:-true}
      - DNSSEC=${DNSSEC:-false}
      - DOH_ENABLED=${DOH_ENABLED:-false}
      - DOH_PATH=${DOH_PATH:-/dns-query}
      - DOH_AUTH_TOKEN=${DOH_AUTH_TOKEN:-}
      - DOT_ENABLED=${DOT_ENABLED:-false}
      - DOT_PORT=${DOT_PORT:-853}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-/etc/resolix/tls.crt}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-/etc/resolix/tls.key}
    ports:
      - "127.0.0.1:${PORT:-35353}:35353"
    volumes:
      - ./history:/var/lib/resolix
      - ./tailscale:/var/lib/tailscale
      # Mount certificates when DOT_ENABLED=true:
      # - ./certs:/etc/resolix:ro
      # Prefer a Docker secret over TS_AUTHKEY:
      # - ./secrets/tailscale_authkey:/run/secrets/tailscale_authkey:ro
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    restart: unless-stopped
